<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="description" content="這裡是我的個人音樂收藏空間，分享喜歡的專輯，記錄專輯資訊、收錄曲目，以及那些值得反覆聆聽的歌曲。">
  <title>My Album Collection</title>
  <link rel="stylesheet" href="style.css">
  <script src="albums.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="My Album Collection 首頁">
        <span class="brand-mark" aria-hidden="true">♫</span>
        <span>My Album Collection</span>
      </a>
      <a class="nav-link" href="#albums">我的收藏 <span aria-hidden="true">↓</span></a>
    </div>
  </header>

  <main id="home">
    <section class="intro" aria-labelledby="page-title">
      <div class="intro-copy">
        <p class="eyebrow"><span aria-hidden="true">✦</span> A LITTLE SPACE FOR MUSIC</p>
        <h1 id="page-title">分享喜歡的音樂，收藏每一張專輯</h1>
        <p class="intro-description">這裡是我的個人音樂收藏空間，分享喜歡的專輯，記錄專輯資訊、收錄曲目，以及那些值得反覆聆聽的歌曲。</p>
        <a class="primary-link" href="#albums">逛逛專輯 <span aria-hidden="true">↘</span></a>
      </div>
      <div class="intro-art" aria-hidden="true">
        <span class="art-sparkle sparkle-one">✦</span>
        <span class="art-sparkle sparkle-two">✧</span>
        <span class="art-disc"><span></span></span>
        <span class="art-note">♫</span>
      </div>
    </section>

    <section class="collection-section" id="albums" aria-labelledby="collection-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">THE COLLECTION</p>
          <h2 id="collection-title">專輯收藏 <span class="heading-heart" aria-hidden="true">♥</span></h2>
        </div>
        <p class="collection-count" id="album-count" aria-live="polite"></p>
      </div>
      <div class="album-grid" id="album-grid" aria-live="polite"></div>
      <p class="empty-message" id="load-message" role="status" hidden></p>
    </section>

    <section class="album-detail" id="album-detail" aria-labelledby="detail-title" hidden>
      <button class="back-button" id="back-button" type="button"><span aria-hidden="true">←</span> 返回專輯收藏</button>
      <article class="detail-card">
        <div class="detail-cover-wrap">
          <img class="detail-cover" id="detail-cover" alt="">
          <div class="cover-fallback detail-fallback" id="detail-cover-fallback" hidden aria-hidden="true">
            <span>♫</span>
            <span>封面暫時無法顯示</span>
          </div>
        </div>
        <div class="detail-copy">
          <p class="eyebrow">ALBUM NOTES</p>
          <h2 id="detail-title"></h2>
          <p class="detail-artist" id="detail-artist"></p>
          <p class="detail-year" id="detail-year"></p>
          <p class="detail-edition" id="detail-edition"></p>
          <div class="detail-divider"></div>
          <h3>關於這張專輯</h3>
          <p class="detail-description" id="detail-description"></p>
          <h3>收藏心得</h3>
          <p class="detail-notes" id="detail-notes"></p>
          <section class="tracklist-section" aria-labelledby="tracklist-heading">
            <div class="tracklist-heading">
              <h3 id="tracklist-heading">Tracklist</h3>
              <span class="track-count" id="track-count"></span>
            </div>
            <ol class="tracklist" id="tracklist"></ol>
            <p class="tracklist-note" id="tracklist-note" hidden></p>
            <p class="tracklist-status" id="tracklist-status" role="status"></p>
            <p class="tracklist-source" id="tracklist-source-wrap" hidden>
              曲目來源：<a id="tracklist-source" target="_blank" rel="noopener noreferrer"></a>
            </p>
            <p class="tracklist-source" id="tracklist-note-source-wrap" hidden>
            差異參考：<a id="tracklist-note-source" target="_blank" rel="noopener noreferrer"></a>
            </p>
          </section>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made with <span aria-label="愛">♥</span> and a love for music.</p>
    <a href="#home">回到頂部 ↑</a>
  </footer>
</body>
</html>
